<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Conectar agenda — O Corpo Responde</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#eef6f4;color:#092b38;font:16px/1.6 system-ui,sans-serif}main{width:100%;max-width:500px;padding:32px;border:1px solid #c5e0dc;border-radius:24px;background:white;box-shadow:0 20px 70px #092b3810}img{width:200px;max-width:100%;margin-bottom:24px}h1{font-size:30px;line-height:1.15;margin:0 0 16px}p{color:#52656b}label{display:block;font-weight:600}input,button{width:100%;font:inherit;border-radius:10px;padding:13px;margin-top:8px}input{border:1px solid #a9c8c3}button{background:#42b4a3;border:0;color:#092b38;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}a{color:#167d70}#status{padding:12px 0;margin:0;overflow-wrap:anywhere}
</style></head><body><main><img src="logo-transparent.png" alt="O Corpo Responde"><h1>Conectar sua agenda</h1><p>Autorize a conta Google indicada pelo administrador para consultar horários livres e receber os agendamentos do site.</p><form id="connect"><label for="secret">Código de conexão fornecido pelo administrador</label><input id="secret" type="password" required autocomplete="off"><button type="submit">Conectar Google Calendar</button></form><p id="status" role="status" aria-live="polite"></p><p>A autorização é feita no Google. Sua senha não é compartilhada com o site.</p><a href="/">Voltar ao site</a></main><script>
const form=document.querySelector('#connect'),status=document.querySelector('#status');const result=new URLSearchParams(location.search).get('status');if(result==='conectado'){status.textContent='Agenda conectada. Os horários agora podem ser consultados pelo site.';form.hidden=true;}else if(result==='cancelado'){status.textContent='Conexão cancelada. Você pode tentar novamente.';}history.replaceState(null,'',location.pathname);form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Preparando a autorização…';try{const response=await fetch('/api/oauth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:document.querySelector('#secret').value})});const data=await response.json();if(!response.ok)throw Error(data.error);document.querySelector('#secret').value='';const url=new URL(data.url);if(url.origin!=='https://accounts.google.com')throw Error('Endereço de autorização inválido.');location.assign(url.href);}catch(error){status.textContent=error.message||'Não foi possível conectar. Tente novamente.';button.disabled=false;}});
</script></body></html>
